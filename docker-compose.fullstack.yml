# Full-stack real-LLM end-to-end harness (runtime 0.9.0; siblings pinned by commit).
#
# Brings up the complete MACP stack on the runtime 0.9.0 release so the example
# agents (LangGraph / LangChain / CrewAI / custom) actually call a real LLM and
# drive a decision session on the runtime, observed by the control-plane.
#
# Auth: JWT throughout. auth-service mints RS256 JWTs; the runtime validates
# them via the auth-service JWKS (issuer/audience must match). macp-playground
# mints a per-agent JWT on every spawn; the control-plane mints an observer JWT.
#
# v0.5.0 note (still current at 0.9.0): the runtime image does not bake
# `MACP_ALLOW_INSECURE=1` and refuses to start without auth unless it is set
# explicitly — we set it below (required for plaintext gRPC regardless of JWT
# auth). The runtime also exposes a Prometheus text endpoint on
# `MACP_METRICS_ADDR` (:9464 here).
#
# Runtime image tag: pinned to the released `:0.9.0` semver tag (immutable, multi-arch
# linux/amd64 + linux/arm64). Upstream's release-plz publishes `:X.Y.Z` / `:X.Y` images
# (multiagentcoordinationprotocol/macp-runtime#184, fixed in v0.8.2). CI's
# `runtime-policy-admission` job reads this exact tag, so bumping it here re-proves every
# shipped policy against the new binary.
#
# 0.9.0 is a WIRE break, unlike the 0.8.x patch series: new sessions bind semantics_rev 4,
# every gRPC Status carries its registry code in `macp-error-code` metadata, a denied
# commitment carries structured `denials`, and the proto moves to macp-proto 0.1.11.
# The SDKs this repo pins (macp-sdk-typescript 0.17 / macp-sdk-python 0.17) both
# require runtime >= 0.9.0 (0.16 was the line that first absorbed it). Upgrade notes:
# https://github.com/multiagentcoordinationprotocol/macp-runtime/blob/main/docs/deployment.md#upgrading-to-090
#
# Prereqs:
#   runtime      — pulled from ghcr (no local Rust build needed)
#   control-plane / auth-service — built locally, tagged with the exact sibling commit:
#     macp-control-plane:778258e  (macp-control-plane#118: per-run event transactions
#                                  serialized, so concurrent events no longer drop from
#                                  the projection; on top of #114's runtime 0.9.0 alignment)
#     macp-auth-service:5270353   (auth-service#41)
#   Neither sibling publishes semver image tags — GHCR carries only `sha-<commit>` tags,
#   and macp-control-plane's are linux/amd64-only — so these follow the local-build
#   convention, with the commit as the tag so the pin is unambiguous. Build from a clean
#   tree (a dirty checkout would otherwise leak into the image):
#     export GITHUB_TOKEN=$(gh auth token)   # read:packages, for the private proto package
#     git -C ../macp-control-plane archive 778258e | \
#       docker build --secret id=npm_token,env=GITHUB_TOKEN -t macp-control-plane:778258e -
#     git -C ../auth-service archive 5270353 | docker build -t macp-auth-service:5270353 -
#   On linux/amd64 hosts `ghcr.io/multiagentcoordinationprotocol/<name>:sha-<commit>` is the
#   same build, published. macp-ui-console (6e16db0, #60) is not part of this stack.
#   playground — built from this checkout (`docker compose ... up --build`; needs NODE_AUTH_TOKEN)
#
# Run:  OPENAI_API_KEY=sk-... docker compose -f docker-compose.fullstack.yml up

services:
  auth-service:
    image: macp-auth-service:5270353
    ports:
      - '3200:3200'
    environment:
      PORT: '3200'
      MACP_AUTH_ISSUER: macp-auth-service
      MACP_AUTH_AUDIENCE: macp-runtime
      MACP_AUTH_DEFAULT_TTL_SECONDS: '3600'
      MACP_AUTH_MAX_TTL_SECONDS: '7200'
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3200/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 10

  runtime:
    # Behaviour changes in 0.9.0 that reach this harness (all Decision mode):
    #   - semantics_rev 4 (new sessions only): Vote.vote / Evaluation.recommendation must be
    #     UPPER_CASE exactly, and Objection.severity lowercase and non-empty — refusals are
    #     INVALID_ENVELOPE. (Rev 4 also tightens Handoff rule 3a and Task rule 2a; no
    #     scenario here uses those modes.)
    #   - a denied commitment still NACKs with POLICY_DENIED, but its gRPC status is now
    #     PERMISSION_DENIED (was FAILED_PRECONDITION) and it carries structured `denials`
    #     ({code, message, participants}); veto messages no longer embed participant ids.
    #   - registration refuses schema_version outside {1,2,3}, `rules.audit`, and any `x-`
    #     vendor key (this binary registers no RuleExtension).
    image: ghcr.io/multiagentcoordinationprotocol/macp-runtime:0.9.0
    ports:
      - '50051:50051'
      # Prometheus text endpoint (v0.5.0+): curl http://localhost:9464/metrics
      - '9464:9464'
    environment:
      MACP_BIND_ADDR: 0.0.0.0:50051
      # v0.5.0+ does not bake this into the image — required for plaintext gRPC.
      MACP_ALLOW_INSECURE: '1'
      MACP_MEMORY_ONLY: '1'
      # Prometheus text endpoint (mode counters etc.) — observability demo surface.
      MACP_METRICS_ADDR: 0.0.0.0:9464
      # JWT validation against the auth-service JWKS.
      MACP_AUTH_ISSUER: macp-auth-service
      MACP_AUTH_AUDIENCE: macp-runtime
      MACP_AUTH_JWKS_URL: http://auth-service:3200/.well-known/jwks.json
      MACP_AUTH_JWKS_TTL_SECS: '60'
      # --- Read-only policy registry variant (v0.5.0+) -------------------------
      # Uncomment to have the runtime own the policy registry from disk instead
      # of accepting RegisterPolicy RPCs. Pair with REGISTER_POLICIES_ON_LAUNCH
      # 'false' on macp-playground below; the registrar then verifies presence
      # (managed_by_runtime) rather than mutating. See docs/policy-authoring.md
      # and src/policy/policy-registrar.service.ts.
      #
      # Run `npm run policies:stage` first and mount ITS output, never ./policies:
      # ./policies holds policy.default.json, whose reserved id the runtime refuses
      # (INVALID_POLICY_DEFINITION), and a preload rejection aborts startup.
      # MACP_POLICIES_DIR: /policies
    # volumes:
    #   - ./.policies-registrable:/policies:ro
    depends_on:
      auth-service:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: macp_control_plane
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 10

  migrate:
    image: macp-control-plane:778258e
    command: ['node', 'dist/db/migrate.js']
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/macp_control_plane
    depends_on:
      postgres:
        condition: service_healthy

  macp-control-plane:
    image: macp-control-plane:778258e
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/macp_control_plane
      RUNTIME_ADDRESS: runtime:50051
      RUNTIME_TLS: 'false'
      RUNTIME_ALLOW_INSECURE: 'true'
      RUNTIME_DEV_AGENT_ID: macp-control-plane
      MACP_AUTH_SERVICE_URL: http://auth-service:3200
      # Production guards: the CP refuses to boot without these set.
      AUTH_API_KEYS: demo-key
      STREAM_HUB_STRATEGY: memory
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      runtime:
        condition: service_started
      auth-service:
        condition: service_healthy

  macp-playground:
    image: macp-playground:local
    build:
      context: .
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: '3000'
      PACKS_DIR: /app/packs
      REGISTRY_CACHE_TTL_MS: '0'
      AUTO_BOOTSTRAP_EXAMPLE_AGENTS: 'true'
      # Set 'false' when the runtime owns the registry via MACP_POLICIES_DIR
      # (see the read-only variant on the runtime service above).
      REGISTER_POLICIES_ON_LAUNCH: 'true'
      EXAMPLE_AGENT_PYTHON_PATH: python3
      # Direct-agent-auth: agents open their own gRPC channel to the runtime.
      MACP_RUNTIME_ADDRESS: runtime:50051
      MACP_RUNTIME_TLS: 'false'
      MACP_RUNTIME_ALLOW_INSECURE: 'true'
      # AUTH-2: every spawn mints a JWT via the auth-service.
      MACP_AUTH_SERVICE_URL: http://auth-service:3200
      MACP_AUTH_TOKEN_TTL_SECONDS: '3600'
      # CP-1: best-effort POST /runs registration — same demo-key AUTH_API_KEYS
      # enforces on the control-plane's own AuthGuard above.
      MACP_CONTROL_PLANE_URL: http://macp-control-plane:3001
      MACP_CONTROL_PLANE_API_KEY: demo-key
      # Real LLM key — agents (LangGraph/LangChain/CrewAI) call OpenAI.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in the environment}
    depends_on:
      runtime:
        condition: service_started
      auth-service:
        condition: service_healthy
      macp-control-plane:
        condition: service_started
